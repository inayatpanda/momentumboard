<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Match the app background before the theme preference is applied. -->
    <meta name="theme-color" content="#101216" />
    <link rel="icon" href="/icon.svg?v=signal-20261020" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=signal-20261020" />
    <!-- Fonts are self-hosted (recon §2.6 row 0a: the Google origin was
         render-blocking and dead offline). Faces declared in src/styles/tokens.css. -->
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>StreetSignal</title>
    <script>
      // Theme boot: applied before first paint to avoid flash.
      ;(function () {
        var pref = localStorage.getItem('mb-theme') || 'auto'
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#101216' : '#f7f8fa')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
