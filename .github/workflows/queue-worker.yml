# Drains the `work-queue` blob that Netlify's (still-free) scheduled functions
# fill: video analysis, event dossiers, compose retries. Three-hourly;
# leased inside the script so overlap is safe. Runs the same handler modules
# the old background-function HTTP kicks used to reach.
name: queue-worker
on:
  schedule:
    # When this repository was private, polling every 15
    # minutes spent 117 of the last 143 billed minutes — five times what the
    # morning paper costs — usually to find an empty queue. Exhausting the
    # budget blocked EVERY workflow, which is what stopped the paper on 27/28
    # July and mailed "all jobs have failed" all day. Three-hourly is plenty for
    # background enrichment (video reads, dossiers); the paper has its own crons.
    # Once the Netlify dispatcher lands this schedule can go entirely: the queue
    # only needs draining when something is actually queued.
    # First drain at 08:20 UTC, AFTER the morning paper's cron window: drains
    # share Groq's 100k tokens-per-day budget with the composer, and the
    # 00:20/03:20/06:20 slots were spending the freshly reset budget before the
    # paper's first claim on it — on a Gemini-depleted day that alone can kill
    # the edition (2026-08-04). Keep the cadence after public release because
    # provider budgets still apply even though standard runner minutes are free.
    - cron: '20 8-23/3 * * *'
  workflow_dispatch:
    inputs:
      videos_only:
        description: 'Process YouTube jobs only (no paper, dossiers or notifications)'
        type: boolean
        default: true
      video_url:
        description: 'Optional: retry one video already in the discovered inbox'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: queue-worker
  cancel-in-progress: false
jobs:
  drain:
    if: github.repository == 'inayatpanda/momentumboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # cache node_modules itself, not just the npm cache: `npm ci` wipes and
      # reinstalls every run, and it is most of the billed minute.
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - run: npx tsx scripts/bg/drain-queue.mts
        env:
          VIDEOS_ONLY: ${{ github.event.inputs.videos_only || 'false' }}
          VIDEO_URL: ${{ github.event.inputs.video_url || '' }}
          URL: https://thestreetsignal.rqai.co.uk
          # Cloudflare cutover 2026-08-13: the store is D1 over its HTTP API.
          STORE_BACKEND: d1
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # OpenAI-compatible slot = DeepSeek (see lib/llm.ts; logs name it "openai")
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_BASE_URL: https://api.deepseek.com
          OPENAI_MODEL: deepseek-chat
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          REPORT_PUBLISH_TOKEN: ${{ secrets.REPORT_PUBLISH_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_SECRET_KEY: ${{ secrets.T212_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
