name: market-test
on:
  schedule:
    - cron: '45 21 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: daily-paper
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'inayatpanda/momentumboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - run: npx tsx scripts/bg/test-market.mts
        env:
          URL: https://thestreetsignal.rqai.co.uk
          STORE_BACKEND: d1
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
