name: webull-sandbox-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'inayatpanda/momentumboard'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install official SDK for this test only
        run: python -m pip install 'webull-openapi-python-sdk==3.0.4'
      - name: Read-only test with publicly documented UK sandbox credentials
        run: python scripts/webull-sandbox-smoke.py
      - name: Record result without account IDs, credentials or market data
        if: always()
        run: |
          if test -f webull-sandbox-result.json; then
            echo '## Webull UK free sandbox check' >> "$GITHUB_STEP_SUMMARY"
            echo 'Read-only connectivity test. Sandbox data is not used in StreetSignal.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat webull-sandbox-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
