# The morning engine + paper. report-kick.mts was deleted (audit C-1), so this
# Actions cron is now the ONLY trigger — hence three redundant morning shots so
# a dropped/late GitHub run still lands a paper. daily-run.mts is idempotent
# (fresh board / existing report → no-op) so only the first shot past the
# London-06:00 floor composes; the rest are cheap no-ops. The floor (in
# daily-run.mts) keeps GMT/winter from publishing an hour early (audit M-2).
name: daily-paper
on:
  schedule:
    - cron: '35 5 * * *' # 06:35 BST (summer) — composes; 05:35 GMT (winter) — held by the floor
    - cron: '35 6 * * *' # 06:35 GMT (winter) — composes; already done in summer
    - cron: '35 7 * * *' # late-drift fallback
  workflow_dispatch: {}
concurrency:
  group: daily-paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # cache node_modules itself, not just the npm cache: `npm ci` wipes and
      # reinstalls every run, and it is most of the billed minute.
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - run: npx tsx scripts/bg/daily-run.mts
        env:
          URL: https://thestreetsignal.rqai.co.uk
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # Cloudflare cutover 2026-08-13: the store is D1 over its HTTP API.
          STORE_BACKEND: d1
          CLOUDFLARE_ACCOUNT_ID: 2fbc7e35cca809db004dd6f951c16352
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # OpenAI-compatible slot = DeepSeek (see lib/llm.ts; logs name it "openai")
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_BASE_URL: https://api.deepseek.com
          OPENAI_MODEL: deepseek-chat
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          REPORT_PUBLISH_TOKEN: ${{ secrets.REPORT_PUBLISH_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_SECRET_KEY: ${{ secrets.T212_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
