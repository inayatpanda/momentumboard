# The morning engine + paper, moved off Netlify background functions (not on
# the free plan). 05:35 UTC — 15 min after Netlify's legacy 05:20 kick — so
# while the paid plan lingers, the guard in daily-run.mts sees the work already
# done and no-ops; after the downgrade this is the only path. Actions cron can
# run a few minutes late; the paper needs to exist by ~07:00 UK, so the slack
# is fine.
name: daily-paper
on:
  schedule:
    - cron: '35 5 * * *'
  workflow_dispatch: {}
concurrency:
  group: daily-paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/bg/daily-run.mts
        env:
          URL: https://thestreetsignal.rqai.co.uk
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_SECRET_KEY: ${{ secrets.T212_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
