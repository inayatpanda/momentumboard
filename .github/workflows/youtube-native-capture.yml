name: youtube-native-capture
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Optional public video ID already discovered by StreetSignal'
        type: string
        required: false
      cached_only:
        description: 'Publish saved results only, with no transcription API calls'
        type: boolean
        default: true
      force_video:
        description: 'For a targeted verification, read the video even if saved captions exist'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: youtube-native-capture
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'inayatpanda/momentumboard' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (vars.YOUTUBE_FREE_TIER_CONFIRMED == 'true' && vars.YOUTUBE_NATIVE_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resume full video coverage and publish findings within free allowance
        run: npx tsx scripts/bg/capture-native-videos.mts
        env:
          VIDEO_ID: ${{ inputs.video_id || '' }}
          NATIVE_FORCE_VIDEO: ${{ inputs.video_id != '' && inputs.force_video == true }}
          NATIVE_CACHED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.cached_only == true }}
          NATIVE_FREE_TIER_CONFIRMED: ${{ vars.YOUTUBE_FREE_TIER_CONFIRMED }}
          NATIVE_SCHEDULE_ENABLED: ${{ vars.YOUTUBE_NATIVE_SCHEDULE_ENABLED }}
          # Never fall back to the application's potentially billable key.
          GEMINI_YOUTUBE_FREE_API_KEY: ${{ vars.YOUTUBE_FREE_TIER_CONFIRMED == 'true' && inputs.cached_only != true && secrets.GEMINI_YOUTUBE_FREE_API_KEY || '' }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          STORE_BACKEND: d1
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
