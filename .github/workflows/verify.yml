name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Check optional desktop dependencies
        run: |
          npm audit --prefix desktop --audit-level=low
          node --check desktop/main.js
      - run: npm test
      - run: npm run build
      - run: node scripts/check-budgets.mjs --enforce
