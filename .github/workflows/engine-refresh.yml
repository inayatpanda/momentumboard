name: engine-refresh
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: daily-paper
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'inayatpanda/momentumboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/cache@v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - run: npx tsx scripts/bg/refresh-engine.mts
        env:
          URL: https://thestreetsignal.rqai.co.uk
          STORE_BACKEND: d1
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
