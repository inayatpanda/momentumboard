name: financial-refresh
on:
  schedule:
    - cron: '35 13 * * *'
    - cron: '35 22 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: financial-refresh
  cancel-in-progress: false
jobs:
  financials:
    if: github.repository == 'inayatpanda/momentumboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/cache@v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - name: Refresh dated company reports
        id: financial_reports
        timeout-minutes: 10
        run: npx tsx scripts/bg/refresh-financials.mts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          STORE_BACKEND: d1
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Scan independent stock strategies
        timeout-minutes: 13
        if: ${{ !cancelled() && (steps.financial_reports.outcome == 'success' || steps.financial_reports.outcome == 'failure') }}
        run: npx tsx scripts/bg/refresh-strategy-choices.mts
        env:
          STORE_BACKEND: d1
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
