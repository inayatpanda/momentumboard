# The scheduled Worker. Not deployed yet — M2 is local/miniflare only, and
# `wrangler login` is the owner's to run (design §4).
#
# WHY A SEPARATE WORKER: Pages Functions serve the site on its custom domain but
# cannot carry cron triggers. This one lives on *.workers.dev, needs no domain,
# and shares the D1 database with the Pages project.

name = "streetsignal-cron"
main = "index.ts"
compatibility_date = "2026-08-01"

# The handlers reach for Buffer, node:crypto and web-push. Also populates
# `process.env` from the vars and secrets below, which is what lets 23 handler
# files keep their existing `process.env.X` reads unchanged (lib/runtimeEnv.ts).
compatibility_flags = ["nodejs_compat"]

[triggers]
# The three the design fixes (§2). Every other Netlify schedule fires on a
# minute divisible by five (12:45, 16:05, 06:10/18:10, 08:00), so the */5 tick
# carries them at their exact original cadence — lib/cron.ts's job table decides
# which are due. Cloudflare's free plan allows five triggers; this uses three.
crons = [
  "*/5 * * * *",   # alert-check, and the four bulletins/sweeps that land on :00/:05/:10/:45
  "*/15 * * * *",  # alert-tail (the long tail, its own subrequest budget) + the D1 cache sweep; also reaches watchdog's 07:15 weekday slot (cron.ts decides)
  "20 5 * * 1-5",  # report-kick → predict-background, OFF unless WORKER_OWNS_PREDICT=1
]

[[d1_databases]]
binding = "STREETSIGNAL_DB"
database_name = "streetsignal"
# M3 fills this in from `wrangler d1 create streetsignal`. Left blank on purpose:
# a placeholder id that happens to be valid is worse than a deploy that refuses.
database_id = "2497573a-0c2a-4fc9-902c-57a062621731"

[observability]
enabled = true

[vars]
# Non-secret switches. Everything else is a SECRET and is set with
# `wrangler secret put <NAME>` — the full list is in .superpowers/sdd/m2-report.md.
STORE_BACKEND = "d1"
WORKER_OWNS_PREDICT = "0"

# ── PREVIEWS ARE NOT PRODUCTION (I-7) ──
#
# See the Pages wrangler.toml for the full reasoning; it applies twice over to a
# cron Worker, whose whole job is to write. With no `[env.preview]` a
# `--env preview` deploy would inherit the top-level D1 binding and
# `STORE_BACKEND = "d1"` and start ticking against the live database.
#
# Previews must never write the production database. `blobs` without Netlify
# credentials degrades to the in-memory store, which is exactly right for a
# preview. No triggers either: a preview Worker that fires on a schedule is a
# second scheduler nobody asked for.
[env.preview]

[env.preview.triggers]
crons = []

[env.preview.vars]
STORE_BACKEND = "blobs"
WORKER_OWNS_PREDICT = "0"
