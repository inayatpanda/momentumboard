[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- Security headers (audit M-4) ---
# Deliberately the SAFE subset: clickjacking + referrer + feature-policy + safe
# CSP directives that cannot break the app. The resource-restricting CSP
# (script-src/style-src/connect-src) is intentionally omitted for now: the app
# leans heavily on inline styles and an inline theme-boot script, so an
# enforcing CSP needs a waking end-to-end test before it goes live. Add it in
# report-only mode first — see the overnight report.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# L-1: content-hashed build assets never change under their name — cache them
# hard. HTML/manifest/worker keep the short cache the SPA needs.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# L-2: the manifest was served as application/octet-stream.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market-data"
  status = 200

[[redirects]]
  from = "/api/engine"
  to = "/.netlify/functions/engine"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config-sync"
  status = 200

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/helm-export"
  status = 200

[[redirects]]
  from = "/report"
  to = "/.netlify/functions/report"
  status = 200

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai-insights"
  status = 200

[[redirects]]
  from = "/api/backup"
  to = "/.netlify/functions/backup"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

[[redirects]]
  from = "/api/licences"
  to = "/.netlify/functions/licences"
  status = 200

[[redirects]]
  from = "/api/t212"
  to = "/.netlify/functions/t212"
  status = 200

[[redirects]]
  from = "/download/*"
  to = "/.netlify/functions/download?platform=:splat"
  status = 200

# SPA catch-all: the public site's sub-pages (/engine, /paper, /ledger, /faq)
# are client-routed. MUST STAY LAST — Netlify redirects match top-down, and
# static files are still served directly (no force) before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
