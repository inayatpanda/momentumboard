[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market-data"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config-sync"
  status = 200

[[redirects]]
  from = "/report"
  to = "/.netlify/functions/report"
  status = 200

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai-insights"
  status = 200
