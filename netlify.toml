# THIS FILE NO LONGER DEPLOYS ANYTHING (M-3).
#
# The Netlify site was disabled on 2026-08-12 and the Cloudflare cutover
# completed on 2026-08-13. Nothing reads the `[build]`, `[functions]` or
# `[[redirects]]` blocks below at deploy time any more; pushing to this repo
# deploys nothing at all.
#
# PRODUCTION IS DEPLOYED BY HAND, from a clean tree, in two commands:
#
#     npm run deploy:pages     # npx wrangler pages deploy  → the Pages project
#                              #   (dist/ + functions/, per ./wrangler.toml)
#     npm run deploy:cron      # npx wrangler deploy, in workers/cron/
#
# Run `npm run build` first: `wrangler pages deploy` publishes whatever is in
# dist/ and will happily ship a stale one.
#
# SO WHY IS THE FILE STILL HERE? Because it is still the source of truth two
# test files parse. `router.test.ts` reads the `[[redirects]]` table and fails
# if lib/router.ts's route map disagrees with it, and `hosting.test.ts` reads
# the `[[headers]]` blocks and fails if public/_headers or the function-response
# set in lib/router.ts drifts from them. Deleting it today would delete that
# check with it. It goes when the netlify.toml-retirement task moves both
# sources into code — not before, and not by accident.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- Security headers (audit M-4) ---
# Deliberately the SAFE subset: clickjacking + referrer + feature-policy + safe
# CSP directives that cannot break the app. The resource-restricting CSP
# (script-src/style-src/connect-src) is intentionally omitted for now: the app
# leans heavily on inline styles and an inline theme-boot script, so an
# enforcing CSP needs a waking end-to-end test before it goes live. Add it in
# report-only mode first — see the overnight report.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# L-1: content-hashed build assets never change under their name — cache them
# hard. HTML/manifest/worker keep the short cache the SPA needs.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# L-2: the manifest was served as application/octet-stream.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market-data"
  status = 200

[[redirects]]
  from = "/api/engine"
  to = "/.netlify/functions/engine"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config-sync"
  status = 200

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/helm-export"
  status = 200

[[redirects]]
  from = "/report"
  to = "/.netlify/functions/report"
  status = 200

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai-insights"
  status = 200

[[redirects]]
  from = "/api/backup"
  to = "/.netlify/functions/backup"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

[[redirects]]
  from = "/api/licences"
  to = "/.netlify/functions/licences"
  status = 200

[[redirects]]
  from = "/api/t212"
  to = "/.netlify/functions/t212"
  status = 200

[[redirects]]
  from = "/download/*"
  to = "/.netlify/functions/download?platform=:splat"
  status = 200

# SPA catch-all: the public site's sub-pages (/engine, /paper, /ledger, /faq)
# are client-routed. MUST STAY LAST — Netlify redirects match top-down, and
# static files are still served directly (no force) before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
