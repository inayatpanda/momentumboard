[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market-data"
  status = 200

[[redirects]]
  from = "/api/engine"
  to = "/.netlify/functions/engine"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config-sync"
  status = 200

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/helm-export"
  status = 200

[[redirects]]
  from = "/report"
  to = "/.netlify/functions/report"
  status = 200

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai-insights"
  status = 200

[[redirects]]
  from = "/api/backup"
  to = "/.netlify/functions/backup"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

[[redirects]]
  from = "/api/licences"
  to = "/.netlify/functions/licences"
  status = 200

[[redirects]]
  from = "/api/t212"
  to = "/.netlify/functions/t212"
  status = 200

# SPA catch-all: the public site's sub-pages (/engine, /paper, /ledger, /faq)
# are client-routed. MUST STAY LAST — Netlify redirects match top-down, and
# static files are still served directly (no force) before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
