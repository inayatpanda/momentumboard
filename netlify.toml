[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market-data"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config-sync"
  status = 200
